const dv=n=>n=='VCC'?(pw?1:U):n=='GND'?0:n=='CK'?(pw?ck:U):/^S\d/.test(n)?(pw?sw[+n.slice(1)]:U):n[0]=='U'?ics.find(c=>c.id==n.split('.')[0]).o[n.split('.')[1]]:U;
const val=n=>{if(!par[n])return dv(n);for(const m of dr[fd(n)]){const x=dv(m);if(x!==U)return x}};
function run(ne){let n=0;do{chg=0;const sn={};for(const r in dr)sn[r]=val(dr[r][0]);const sv=x=>par[x]?sn[fd(x)]:dv(x);
for(const c of ics){const T=Y[c.t],on=pw&&val(c.id+'.'+T.v)===1&&val(c.id+'.'+T.g)===0;if(!on){for(const p in c.o){delete c.o[p];chg=1}continue}
const X={S:c.s,v:p=>{const x=(T.q?sv:val)(c.id+'.'+p);return x===U?1:x},set:(p,x)=>{if(c.o[p]!==x){c.o[p]=x;chg=1}},e:(p,r)=>{const cur=X.v(p),old=c.pv[p];c.pv[p]=cur;return!ne&&old!==U&&(r?!old&&cur:old&&!cur)}};T.u.forEach(u=>u(X))}}while(chg&&++n<40)}
const rd=()=>P[pi].l.map((_,i)=>{const v=pw?val('L'+i):U;return v===U?null:v}),z=a=>a.map(x=>x||0);
function tt(m){const e=$('#tz');e.textContent=m;e.classList.remove('s');void e.offsetWidth;e.classList.add('s')}
function dg(){const m=[];ics.forEach(c=>{const T=Y[c.t];if(!cn(c.id+'.'+T.v,'VCC'))m.push(`${c.id} (IC ${c.t}): pin ${T.v} (VCC) is not wired to +5V, so the chip has no power.`);if(!cn(c.id+'.'+T.g,'GND'))m.push(`${c.id} (IC ${c.t}): pin ${T.g} (GND) is not wired to GND.`)});
if(cn('VCC','GND'))m.push('SHORT CIRCUIT: +5V is wired straight to GND. Remove that wire!');
else for(const r in dr){const v=new Set(dr[r].map(dv).filter(x=>x!==U));if(v.size>1)m.push('Two outputs are fighting on one wire ('+dr[r].join(', ')+'). Remove one wire.')}
if(!W.length)m.push('No wires yet. Start by wiring +5V and GND to every IC.');return m}
function pn(n){if(pw)return tt('Turn the power OFF before changing wires.');if(!sel)sel=n;else if(sel==n)sel=null;else{if(!W.some(w=>w.a==sel&&w.b==n||w.a==n&&w.b==sel))W.push({a:sel,b:n,c:CL[W.length%6]});sel=null;rb();run(1)}ui()}
function tp(){if(!pw){if(cn('VCC','GND'))return tt('Short circuit! Remove the +5V–GND wire first.');pw=1;rz(1)}else{pw=0;clearInterval(tm);auto=0;run(1)}ui()}
function rz(k){ics.forEach(c=>{c.o={};c.s={};c.pv={}});log=[];res=null;run(1);if(!k)ui()}
function ts(i){sw[i]^=1;run();ui()}
function ta(){if(!pw)return tt('Switch the power ON first.');auto^=1;clearInterval(tm);if(auto)tm=setInterval(pulse,900);ui()}
async function pulse(){if(!pw)return tt('Switch the power ON first.');if(bz)return;bz=1;const ins=sw.slice(0,P[pi].s.length),b=z(rd());ck=1;run();ui();await new Promise(r=>setTimeout(r,250));ck=0;run();log.push({ins,before:b,after:rd()});if(log.length>40)log.shift();bz=0;ui()}
function cw(){if(pw)return tt('Turn the power OFF first.');W=[];sel=null;rb();run(1);ui()}
function vf(){const p=P[pi];if(!pw)return tt('Switch the power ON first.');let rows=[];
if(p.q)rows=log.map(r=>({x:r.ins,e:p.f(r.ins,r.before),o:r.after}));
else{const n=p.s.length,o=sw.slice();let pr=z(rd());for(let k=0;k<1<<n;k++){const x=[...Array(n)].map((_,j)=>k>>(n-1-j)&1);x.forEach((b,j)=>sw[j]=b);run();const ob=rd();rows.push({x,e:p.f(x,pr),o:ob});pr=z(ob)}o.forEach((b,j)=>sw[j]=b);run()}
rows.forEach(r=>r.ok=r.e.every((v,i)=>r.o[i]===v));const bad=rows.find(r=>!r.ok),need=p.q&&rows.length<4,ok=!bad&&!need&&rows.length>0;let msg;
if(ok){msg='All '+rows.length+' rows match the truth table. Progress saved!';dn[pi]=1;try{localStorage.dvl=JSON.stringify(dn)}catch(e){}}
else if(need)msg='Press Pulse at least 4 times (change the switches too), then press Verify again.';
else{const i=bad.e.findIndex((v,j)=>bad.o[j]!==v);msg=`When ${p.s.map((s,j)=>s+'='+bad.x[j]).join(', ')||'the clock pulses'}, output ${p.l[i]} should be ${bad.e[i]} but ${bad.o[i]==null?'it has no signal. Is it wired to its LED?':'it shows '+bad.o[i]}. Check the wires for that part.`}
res={ok,msg,rows};ui()}
function icH(c){const T=Y[c.t],h=T.n/2,pc=(k,t)=>{const a=`<i>${k}</i>`,b=`<div class=pn data-n="${c.id}.${k}" title="Pin ${k}: ${T.nm.split(',')[k-1]}"></div>`;return`<div class=pc>${t?a+b:b+a}</div>`};
return`<div class=ic><div class=row>${[...Array(h)].map((_,j)=>pc(T.n-j,1)).join('')}</div><b>${c.id} · ${c.t}</b><div class=row>${[...Array(h)].map((_,j)=>pc(j+1,0)).join('')}</div></div>`}
function ld(i){clearInterval(tm);auto=0;bz=0;pi=i;const p=P[i];ics=p.i.map((t,k)=>({id:'U'+(k+1),t,o:{},s:{},pv:{}}));W=[];sw.fill(0);ck=0;pw=0;log=[];res=null;sel=null;
$('#info').innerHTML=`<h2>Exp ${p.e}: ${p.n}</h2><p class=mu>ICs: ${p.i.map(t=>'IC '+t).join(', ')}</p><ol><li>Click one pin, then another pin, to join them with a wire. Click a wire to remove it.</li><li>Keep power OFF while wiring.</li><li>Wire +5V and GND to every IC, then switches → inputs, outputs → LEDs.</li><li>Power ON, flip switches${p.q?' and press Pulse':''}.</li><li>Press Verify.</li></ol><button class=chip onclick="$('#hn').hidden=!$('#hn').hidden">💡 Hint</button> <button class=chip onclick=vf()>✅ Verify</button> <button class=chip onclick=cw()>🧹 Clear wires</button> <button class=chip onclick=rz()>↺ Reset</button><p id=hn hidden>${p.h}</p><h3>Wiring check</h3><ul id=dg></ul><div id=rv></div>`;
$('#bd').innerHTML=`<svg id=wr></svg><div class=tr><div class=pt><b>POWER</b><button id=pwb class=tg onclick=tp()></button></div><div class=pt><b>+5V</b><div class="pn vcc" data-n=VCC></div></div><div class=pt><b>GND</b><div class="pn gnd" data-n=GND></div></div>${p.s.map((x,k)=>`<div class=pt><b>${x}</b><div class=pn data-n=S${k}></div><button class=tg id=t${k} onclick=ts(${k})></button></div>`).join('')}<div class=pt><b>CLOCK</b><div class=pn data-n=CK></div><button class=chip onclick=pulse()>Pulse</button><button class=chip id=ab onclick=ta()>Auto 1Hz</button></div>${p.l.map((x,k)=>`<div class=pt><b>${x}</b><div class=pn data-n=L${k}></div><div class=led id=L${k}><i></i></div></div>`).join('')}</div><div class=ics>${ics.map(icH).join('')}</div>`;rb();run(1);ui()}
function dw(){const B=$('#bd'),b=B.getBoundingClientRect(),pos=n=>{const e=$('[data-n="'+n+'"]');if(!e)return[0,0];const r=e.getBoundingClientRect();return[r.left-b.left-B.clientLeft+r.width/2,r.top-b.top-B.clientTop+r.height/2]};
$('#wr').innerHTML=W.map((w,k)=>{const[a,b2]=pos(w.a),[c,d]=pos(w.b),s=`M${a} ${b2}C${a} ${b2+50},${c} ${d+50},${c} ${d}`;return`<path data-w=${k} d="${s}" stroke="${w.c}"/>${pw&&val(w.a)===1?`<path class=fl style="pointer-events:none" d="${s}"/>`:''}`}).join('')}
function ui(){const p=P[pi];$('#pwb').classList.toggle('on',!!pw);$('#ab').textContent=auto?'⏸ Stop':'Auto 1Hz';$('#st').textContent=pw?'⚡ POWER ON — '+log.length+' clock pulses':'POWER OFF';
sw.forEach((v,i)=>{const t=$('#t'+i);t&&t.classList.toggle('on',!!v)});p.l.forEach((_,i)=>$('#L'+i).classList.toggle('on',pw&&val('L'+i)===1));
Q('.pn').forEach(e=>{const n=e.dataset.n,v=val(n);e.classList.toggle('h',pw&&v===1);e.classList.toggle('l',pw&&v===0);e.classList.toggle('sel',n==sel)});dw();
const m=dg();$('#dg').innerHTML=m.length?m.map(x=>'<li>'+x+'</li>').join(''):'<li>✔ No wiring problems found.'+(pw?'':' Switch the power ON.')+'</li>';
$('#rv').innerHTML=res?`<h3 class=pop>${res.ok?'🎉 Passed!':'Not correct yet'}</h3><p>${res.msg}</p><small class=mu>Inputs: ${p.s.join(' ')||'–'} · Outputs: ${p.l.join(' ')}</small><table><tr><th>In</th><th>Expected</th><th>Observed</th><th></th></tr>${res.rows.slice(-40).map(r=>`<tr class=${r.ok?'g':'b'}><td>${r.x.join('')}</td><td>${r.e.join('')}</td><td>${r.o.map(v=>v==null?'?':v).join('')}</td><td>${r.ok?'✓':'✗'}</td></tr>`).join('')}</table>`:'';
$('#xs').innerHTML=ex.map(e=>{const ps=P.map((q,i)=>i).filter(i=>P[i].e==e);return`<button class="chip${p.e==e?' on':''}${ps.every(i=>dn[i])?' ok':''}" onclick=ld(${ps[0]})>Exp ${e}</button>`}).join('');
$('#ps').innerHTML=P.map((q,i)=>q.e==p.e?`<button class="chip${i==pi?' on':''}${dn[i]?' ok':''}" onclick=ld(${i})>${q.n}</button>`:'').join('')}
$('#bd').onclick=e=>{const p=e.target.closest('.pn'),w=e.target.closest('[data-w]');if(p)pn(p.dataset.n);else if(w){if(pw)return tt('Turn the power OFF before removing wires.');W.splice(+w.dataset.w,1);rb();run(1);ui()}};
onresize=dw;ld(0);
</script></body></html>
